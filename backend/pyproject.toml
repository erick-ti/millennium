[project]
name = "millennium-backend"
version = "0.1.0"
description = "Millennium — Yu-Gi-Oh collection portfolio tracker (backend)"
requires-python = ">=3.13"
readme = "README.md"

dependencies = [
    "django>=5.2.14,<5.3",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.27",
    "celery>=5.4",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "django-environ>=0.14.0",
    "structlog>=24.4",
    "django-structlog>=10.1.0",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "django-stubs-ext>=6.0.6",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "ruff>=0.15.20",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "DJ",
    "RUF",
]
ignore = [
    "E501",     # line length handled by formatter
    "RUF012",   # mutable class defaults — Django/DRF idiom (permission_classes etc.)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Celery's @shared_task is an untyped decorator (celery ships no usable type info —
# see the ignore_missing_imports override below), which mypy --strict rejects via
# disallow_untyped_decorators. Allow it in task modules only — the tests.* precedent.
module = "apps.*.tasks"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "environ", "environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:celery.*",
    # WhiteNoise warns when STATIC_ROOT is empty; tests don't run collectstatic.
    "ignore:No directory at:UserWarning",
]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
