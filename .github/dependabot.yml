# Dependabot config. Weekly checks, grouped into one PR per ecosystem to keep
# the noise down. See docs.github.com for the ecosystem list.
# The npm and uv groups cover only minor and patch updates; major bumps arrive
# as individual PRs so one breaking major can't fail the whole grouped batch.
# Each ecosystem has a 7-day cooldown: a version update waits until the release
# has aged past the window where most malicious releases get caught and yanked.
# Security updates (advisory-backed) bypass cooldown and still come promptly.
# Aged PRs are vetted (age, advisories, install-script and tarball deltas) before
# merge; nothing auto-merges to main.
version: 2
updates:
  # Backend Python dependencies (uv-managed: pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      backend-python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Django stays on the 5.2 LTS (supported to April 2028); the 6.x majors
    # are declined until the 6.2 LTS. Only major version updates are ignored:
    # 5.2.x patch and security releases still arrive. Remove this entry at
    # the 6.2 LTS jump.
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
      # The Django stubs are held below 6.1 in pyproject (6.1 models the
      # Django 6.1 admin API this 5.2 app cannot satisfy), and
      # djangorestframework-stubs 3.18 requires django-stubs 6.1. Dependabot
      # would otherwise raise those bounds itself, so only patch updates of
      # the three stubs packages are taken. Lift with the Django upgrade.
      - dependency-name: "django-stubs"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "django-stubs-ext"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "djangorestframework-stubs"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # Frontend Node dependencies.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Listed first so @hey-api/* matches here, not the catch-all below
      # (Dependabot puts a dependency in the first group it matches). An
      # @hey-api/openapi-ts bump regenerates the committed API client, so it
      # gets its own PR to handle with `make frontend-gen-api`. It is a 0.x
      # package, so even a "minor" bump is breaking and would otherwise trip
      # the client drift gate from inside the auto-safe group.
      frontend-heyapi:
        patterns: ["@hey-api/*"]
      frontend-npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Majors that cannot install or build today, each with the condition that
    # lifts it. A plain close is re-proposed at the next run under a new PR
    # number, so the ignores live here next to their reasons.
    ignore:
      # eslint-config-next's plugins (eslint-plugin-import, eslint-plugin-jsx-a11y,
      # eslint-plugin-react) still pin eslint ^9, so ESLint 10 cannot install.
      # Lift when all three accept it.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint's packages pin typescript <6.1.0, so TypeScript 7
      # cannot install. Lift when typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The DataTable component is written against the react-table v8 API; the
      # v9 major is a planned code migration (see ROADMAP), not a bump.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]

  # GitHub Actions pinned in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Dockerfile base images.
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      backend-docker:
        patterns: ["*"]
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      frontend-docker:
        patterns: ["*"]
