name: images

on:
  push:
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least privilege: build the production images, never push them. No registry
# auth, no packages:write — this gate proves the images BUILD AND BOOT, it does
# not publish them (Railway builds its own from the repo).
permissions:
  contents: read

# Coalesce stacked runs (docker builds + boots): a same-repo PR fires both push
# and pull_request, and rapid pushes pile up.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # REQUIRED check named `backend image` (promoted into the protect-main ruleset
    # 2026-06-13, after passing its first runs — the frontend.yml/e2e.yml
    # advisory→required precedent). Because it gates `main`, a red image build
    # blocks the merge, so Railway autodeploy-on-main (Wait-for-CI off) never sees
    # a broken-image commit. Closes the long-standing unguarded gotcha "No CI builds the backend
    # image": a fail-closed prod env var added WITHOUT a matching placeholder in
    # the Dockerfile collectstatic RUN broke the Railway image build undetected
    # until a deploy. The BUILD runs collectstatic under config.settings.prod, so
    # a missing placeholder fails the build; the BOOT smoke then runs the actual
    # gunicorn CMD (the [::]:$PORT bind + flags from the image slice) and hits the
    # DB-free, AllowAny /api/health/, catching a broken CMD / prod-settings import
    # that the build alone cannot. No Postgres/Redis needed: health touches
    # neither, and DATABASE_URL/REDIS_URL connect lazily (placeholders suffice).
    name: backend image
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: build backend production image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true  # into the daemon so the boot smoke can run it
          tags: millennium-backend:ci
          # GitHub Actions layer cache so the uv sync / apt layers are reused
          # across runs (the build itself is the gate, not its speed).
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: boot + health smoke
        run: |
          # Placeholder prod env (the Dockerfile collectstatic shape) + SSL
          # redirect OFF (the health probe is plain HTTP — a 301 would fail it)
          # + loopback ALLOWED_HOSTS for the curl Host header. No real DB/Redis:
          # /api/health/ is static, and the connection strings resolve lazily.
          # Run on an INJECTED non-default PORT (8901) mapped to host 8000: if a
          # regression ignored $PORT / dropped the `[::]:${PORT:-8000}` shell
          # expansion and bound the baked 8000, nothing would listen on
          # container:8901 and the curl would fail — so this proves Railway's
          # injected-PORT contract, not merely the default.
          docker run -d --name backend-boot -e PORT=8901 -p 8000:8901 \
            -e DJANGO_SETTINGS_MODULE=config.settings.prod \
            -e DJANGO_SECRET_KEY=ci-boot-not-real \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_CSRF_TRUSTED_ORIGINS=https://localhost \
            -e DJANGO_SECURE_SSL_REDIRECT=False \
            -e DATABASE_URL=postgres://build:build@build:5432/build \
            -e REDIS_URL=redis://build:6379/0 \
            -e CELERY_BROKER_URL=redis://build:6379/1 \
            -e CELERY_RESULT_BACKEND=redis://build:6379/2 \
            millennium-backend:ci
          trap 'docker rm -f backend-boot >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' backend-boot 2>/dev/null)" != "true" ]; then
              echo "::error::backend container exited during boot"
              docker logs backend-boot || true
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health/ || true)
            if [ "$code" = "200" ]; then
              echo "backend image served /api/health/ with 200 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::backend image did not serve /api/health/ within 30s (last code: ${code})"
          docker logs backend-boot || true
          exit 1

  frontend:
    # REQUIRED check named `frontend image` (promoted into protect-main 2026-06-13,
    # same as `backend image` above — a red build blocks the merge, so the
    # autodeploy posture never ships a broken image). MORE valuable than the backend job:
    # compose pins `target: dev`, so NOTHING in the repo (not even make dev/build)
    # builds the production build/runtime stages — only a Railway deploy did,
    # until now. The build proves the standalone bundle assembles and the
    # required BACKEND_URL ARG guard fires; the boot smoke (on an injected
    # non-default PORT) proves the runtime stage serves `/`, serves a referenced
    # `/_next/static/*` asset (the `.next/static` COPY actually landed), AND that
    # the baked /api/* rewrite forwards to BACKEND_URL — exercised against a stub
    # aliased to the baked hostname (the e2e suite runs `next start` from SOURCE,
    # never this Docker standalone image, so the image's proxy + asset paths are
    # otherwise unguarded). NOT covered: the glibc-build/glibc-runtime libc match
    # for traced native addons (sharp) loads lazily only on a /_next/image
    # request, and the app has no next/image usage, so neither the build nor this
    # smoke exercises it; the node:24-slim build stage is the structural guard
    # (revisit the smoke if next/image is added).
    name: frontend image
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: build frontend production image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true  # into the daemon so the boot smoke can run it
          tags: millennium-frontend:ci
          # The documented deploy target. It is baked into the standalone
          # server.js; the smoke below points a stub at this exact hostname (via
          # a docker network alias) so the proxied request actually resolves.
          build-args: |
            BACKEND_URL=http://backend.railway.internal:8000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: boot + proxy smoke
        run: |
          # A backend stub aliased to the hostname baked into the image, so the
          # standalone server's /api/* rewrite resolves to it. http-echo answers
          # 200 on every path; pinned by digest (CI-only stub, reproducible,
          # multi-arch manifest-list digest verified working).
          STUB=hashicorp/http-echo@sha256:fcb75f691c8b0414d670ae570240cbf95502cc18a9ba57e982ecac589760a186
          docker network create ci-net
          trap 'docker rm -f frontend-boot backend-stub >/dev/null 2>&1 || true; docker network rm ci-net >/dev/null 2>&1 || true' EXIT
          docker run -d --name backend-stub --network ci-net \
            --network-alias backend.railway.internal \
            "$STUB" -listen=:8000 -text='{"status":"ok"}'
          # Injected non-default PORT (3901) mapped to host 3000 — same
          # injected-PORT proof as the backend job: server.js must honor $PORT,
          # or nothing listens on container:3901 and every curl below fails.
          docker run -d --name frontend-boot --network ci-net -e PORT=3901 -p 3000:3901 millennium-frontend:ci
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' frontend-boot 2>/dev/null)" != "true" ]; then
              echo "::error::frontend container exited during boot"
              docker logs frontend-boot || true
              exit 1
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "::error::frontend image did not serve / with 200 within 30s (last code: ${code})"
            docker logs frontend-boot || true
            exit 1
          fi
          echo "frontend image served / with 200"
          # Static assets must serve from the standalone tree — i.e. the
          # `.next/static` COPY in the runtime stage actually landed. Fetch a
          # /_next/static/* path referenced by the served shell: if the COPY
          # regressed, the shell still returns 200 but every asset 404s, leaving
          # a non-hydrating prod UI. An empty match is itself a failure (a Next
          # shell always references static chunks).
          asset=$(curl -s http://127.0.0.1:3000/ | grep -o '/_next/static/[^"]*' | head -1)
          if [ -z "$asset" ]; then
            echo "::error::no /_next/static/ asset referenced by the served shell — build or parse problem"
            docker logs frontend-boot || true
            exit 1
          fi
          asset_code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000${asset}" || true)
          if [ "$asset_code" != "200" ]; then
            echo "::error::frontend did not serve ${asset} (got ${asset_code}); standalone .next/static COPY broken"
            docker logs frontend-boot || true
            exit 1
          fi
          echo "frontend image served a static asset (${asset}) -> 200"
          # The baked standalone /api/* rewrite must forward to BACKEND_URL.
          api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health/ || true)
          if [ "$api" != "200" ]; then
            echo "::error::frontend did not proxy /api/health/ through the standalone rewrite (got ${api})"
            docker logs frontend-boot || true
            exit 1
          fi
          echo "frontend image proxied /api/health/ -> 200"
