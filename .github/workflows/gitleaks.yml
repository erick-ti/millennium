name: gitleaks

# push is scoped to main so PR branches get exactly one run (pull_request),
# which scans the branch's whole commit range and gates every merge, so
# nothing reaches main unscanned. Scanning branch pushes would not prevent
# a leak anyway: the job starts after GitHub has accepted the objects, and
# on a public repo that acceptance is the exposure. A branch that never
# opens a PR is not scanned by this workflow.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least privilege: gitleaks only reads repo contents to scan.
permissions:
  contents: read

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # full history so PR scans cover the entire diff range, not just the tip commit
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
