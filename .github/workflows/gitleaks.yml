name: gitleaks

# push is scoped to main so PR branches get exactly one run (pull_request).
# An unscoped push trigger fired a second, duplicate run per PR, and the
# push-event run is unreliable on Dependabot branches. Pre-merge coverage
# holds: the pull_request run gates every merge, and a local pre-commit
# gitleaks hook scans each commit before it is ever pushed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least privilege: gitleaks only reads repo contents to scan.
permissions:
  contents: read

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          # full history so PR scans cover the entire diff range, not just the tip commit
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
