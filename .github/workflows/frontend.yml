name: frontend

on:
  push:
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least privilege: this workflow only checks out code and runs lint+build.
permissions:
  contents: read

jobs:
  build:
    name: lint + build
    runs-on: ubuntu-latest
    # Mirrors the backend `tests` job's posture. Intended as a required check
    # on `main` — add `frontend / lint + build` to the protect-main ruleset
    # after this branch merges (the check name has to exist on main once
    # before GitHub will let you select it). Until then the workflow is
    # advisory: a broken next.config / TS error / stale import surfaces here
    # as a red check but does NOT block merge.
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install deps
        run: npm ci

      # NOTE: The snapshot → client drift gate (`npm run gen:api` + porcelain
      # check) deliberately lives in the REQUIRED `tests.yml` workflow, not
      # here — Codex slice 2 round 4 found that a drift gate in an advisory
      # workflow doesn't enforce the committed-client contract (a PR with a
      # stale/missing generated tree could be merged past a red advisory).
      # This workflow keeps only style/type/build checks (lint + typecheck +
      # next build); the contract gate is enforced one job over so promotion of
      # this workflow to required is not a prerequisite for the strategy to be durable.

      - name: lint
        run: npm run lint

      # Full `tsc --noEmit` over the tsconfig include (which covers *.test.tsx). `next
      # build` only type-checks the app module graph, so a type error in a test fixture
      # (e.g. a mock drifting from a serializer-derived type) is invisible to it — this
      # step closes that gap. tsconfig excludes e2e/ (its own typecheck job).
      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test

      - name: build
        run: npm run build
