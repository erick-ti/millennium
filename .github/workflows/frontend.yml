name: frontend

on:
  push:
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least privilege: this workflow only checks out code and runs lint+build.
permissions:
  contents: read

jobs:
  build:
    name: lint + build
    runs-on: ubuntu-latest
    # Required check named `lint + build` in the protect-main ruleset: a broken
    # next.config, a TypeScript error, or a stale import blocks the merge here.
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install deps
        run: npm ci

      # NOTE: the schema-to-client drift gate (`npm run gen:api` plus a
      # porcelain check) lives in the `tests.yml` workflow next to the pytest
      # snapshot check, so both halves of the OpenAPI contract are enforced in
      # one place. This workflow keeps only the style, type, and build checks
      # (lint, typecheck, next build).

      - name: lint
        run: npm run lint

      # Full `tsc --noEmit` over the tsconfig include (which covers *.test.tsx). `next
      # build` only type-checks the app module graph, so a type error in a test fixture
      # (e.g. a mock drifting from a serializer-derived type) is invisible to it, so this
      # step closes that gap. tsconfig excludes e2e/ (its own typecheck job).
      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test

      - name: build
        run: npm run build
