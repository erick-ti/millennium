name: tests

# push only on main: PR branches are already covered by the pull_request
# run, and an unscoped push trigger fired a duplicate run on every PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # allow manual runs from the Actions tab

# Least privilege: this workflow only checks out code and runs tests.
permissions:
  contents: read

jobs:
  postgres:
    name: pytest (postgres)
    runs-on: ubuntu-latest
    # The default `make test` runs on sqlite, where Django skips the
    # CardPrinting NULLS NOT DISTINCT unique constraint, so the suite can pass
    # without exercising the real engine. This job runs the suite against a
    # PostgreSQL 16 service (matching the compose/prod engine) via the
    # `test_postgres` settings, so constraint enforcement is actually verified.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: millennium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/millennium
    defaults:
      run:
        working-directory: backend
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"

      - name: sync deps
        run: uv sync --frozen --group dev

      - name: pytest (postgres-backed settings)
        # Includes `tests/test_schema.py::test_committed_openapi_snapshot_matches_live_schema`,
        # the schema-to-snapshot half of the drift gate.
        run: uv run pytest --ds=config.settings.test_postgres

      # ─── snapshot to client drift gate ───────────────────────────────────
      # The other half of the API-contract drift coverage runs here, next to
      # the pytest snapshot check above, so both halves of the contract are
      # enforced in the same required job. Without it, a PR with a stale or
      # missing `frontend/src/lib/api/generated/` tree could merge with a
      # client that no longer matches the committed schema.

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install frontend deps
        working-directory: frontend
        run: npm ci

      - name: verify generated client matches snapshot
        working-directory: frontend
        # Use `git status --porcelain` (NOT `git diff --exit-code`): diff only
        # inspects TRACKED files, so a commit that omits the generated tree
        # entirely would be regenerated as untracked, diff would see no change,
        # and the gate would falsely pass. Porcelain catches both
        # tracked-modified (`M`) and untracked-new (`??`).
        run: |
          npm run gen:api
          drift=$(git status --porcelain -- src/lib/api/generated)
          if [ -n "$drift" ]; then
            echo "::error::Generated TS client is out of sync with frontend/openapi.json,"
            echo "::error::or the committed repo is missing generated files entirely:"
            echo "$drift" | sed 's/^/::error::  /'
            echo "::error::Run 'make frontend-gen-api' locally and commit the result."
            exit 1
          fi
